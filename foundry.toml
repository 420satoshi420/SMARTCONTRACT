[profile.default]
src = "contracts"
out = "out"
libs = ["contracts/lib"]
remappings = [
    "forge-std/=contracts/lib/forge-std/src/",
    "@openzeppelin/=node_modules/@openzeppelin/"
]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
